<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Handsome Boy 💖</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Sacramento&display=swap" rel="stylesheet">
</head>
<body>

  <div class="hearts-container">
    <div class="floating-heart h1">💖</div>
    <div class="floating-heart h2">💗</div>
    <div class="floating-heart h3">💕</div>
    <div class="floating-heart h4">🌸</div>
    <div class="floating-heart h5">✨</div>
    <div class="floating-heart h6">♥</div>
    <div class="floating-heart h7">💖</div>
    <div class="floating-heart h8">💗</div>
    <div class="floating-heart h9">✨</div>
  </div>

  <input type="checkbox" id="modal-toggle" class="modal-checkbox">

  <main class="card">
    <div class="cute-badge">🌸 Sweet Surprise 🌸</div>

    <div class="hamster-wrapper">
      <svg class="hamster-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="130" rx="65" ry="70" fill="#f4b886" />
        <ellipse cx="100" cy="135" rx="45" ry="50" fill="#fff5ea" />
        
        <circle cx="55" cy="70" r="18" fill="#f4b886" />
        <circle cx="55" cy="70" r="11" fill="#f7a8b8" />
        <circle cx="145" cy="70" r="18" fill="#f4b886" />
        <circle cx="145" cy="70" r="11" fill="#f7a8b8" />

        <path d="M 40,65 Q 48,60 48,68 Q 48,76 40,71 Z" fill="#ff7597" />
        <path d="M 56,65 Q 48,60 48,68 Q 48,76 56,71 Z" fill="#ff7597" />
        <circle cx="48" cy="68" r="4" fill="#ff4d79" />

        <circle cx="75" cy="105" r="7" fill="#3a2518" />
        <circle cx="73" cy="103" r="2.5" fill="#ffffff" />
        
        <path d="M 120 106 Q 125 100 130 106" stroke="#3a2518" stroke-width="3" stroke-linecap="round" fill="none" />

        <ellipse cx="65" cy="115" rx="10" ry="6" fill="#ff99b3" opacity="0.6" />
        <ellipse cx="135" cy="115" rx="10" ry="6" fill="#ff99b3" opacity="0.6" />

        <polygon points="100,108 96,104 104,104" fill="#e2738a" />
        <path d="M 94 112 Q 100 118 100 112 Q 100 118 106 112" stroke="#3a2518" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <g class="bouquet">
          <path d="M 100 145 L 85 190 L 115 190 Z" fill="#d0a87a" />
          <path d="M 85 160 Q 100 165 115 160 L 112 168 Q 100 173 88 168 Z" fill="#ff4d79" />
          <circle cx="100" cy="164" r="5" fill="#cc0033" />
          <circle cx="90" cy="140" r="10" fill="#e60039" />
          <circle cx="105" cy="135" r="12" fill="#ff1a53" />
          <circle cx="118" cy="142" r="9" fill="#cc0033" />
          <circle cx="98" cy="148" r="10" fill="#ff3366" />
          <path d="M 80 135 Q 75 125 85 128 Z" fill="#73a942" />
          <path d="M 125 135 Q 135 125 125 128 Z" fill="#73a942" />
        </g>
      </svg>
    </div>

    <div class="text-container">
      <h2 class="sub-title">For My</h2>
      <h1 class="main-title">Handsome Boy</h1>
      <div class="emojis">🫶🏻 💋</div>
    </div>

    <label for="modal-toggle" class="action-btn">
      ✨ Click here to see a message ✨
    </label>
  </main>

  <div class="modal-overlay">
    <div class="modal-card">
      <label for="modal-toggle" class="close-btn">&times;</label>
      <div class="modal-header">💌 Special Note 💌</div>
      <p class="modal-message">
        "hi lance tot hahaha happy happy 1st day of October thanks kasi nandyan ka everytime na malungkot Ako at masaya thank you sa lahat lahat kasi naging best ever friend kita labyaaaaaaa mwwaaa darling ko🫶🏻"
      </p>
    </div>
  </div>

</body>
</html>
